name: Publication privacy
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  push:
    branches: [main, 'release/**']
permissions:
  contents: read
  pull-requests: read
jobs:
  # Preserve this existing required job name. This read-only job can test PR
  # implementations, but cannot publish the authoritative Security / statuses.
  privacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install existing Python test dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Install checksum-pinned scanner
        run: bash tools/install_gitleaks.sh
      - name: Inspect current tree and regression tests
        run: |
          python tools/check_repo_hygiene.py
          python tools/check_license_inventory.py
          python -m unittest discover -s tests -p 'test*privacy.py' -v
          python -m unittest discover -s tests -p test_security_gate.py -v
          python -m unittest discover -s tests -p test_license_inventory.py -v
      - name: Scan every new commit (complete changed files and their preimages)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tools/security_gate.py --base "$BASE_SHA" --head "$HEAD_SHA" --automated-only --event-file "$GITHUB_EVENT_PATH"
