name: Android durable recovery
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: android-recovery-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ANDROID_AVD_HOME: /tmp/gym-recovery-avds
    strategy:
      fail-fast: false
      matrix:
        api: ['31', '32', '33', '34', '35', '36', '37.0']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Build debug app and database instrumentation tests
        run: ./gradlew :android:testDebugUnitTest :android:assembleDebug :android:assembleDebugAndroidTest
      - name: Free unused native SDK space on this disposable runner
        run: |
          test "${RUNNER_ENVIRONMENT:-}" = 'github-hosted'
          test -n "$ANDROID_HOME"
          # This Kotlin/Compose slice builds no NDK code. Never run on a personal/self-hosted machine.
          if [ -d "$ANDROID_HOME/ndk" ]; then
            du -sh "$ANDROID_HOME/ndk"
            rm -rf -- "$ANDROID_HOME/ndk"
          fi
          df -h "$ANDROID_HOME"
      - name: Install isolated emulator image
        env:
          API: ${{ matrix.api }}
        run: |
          sdkmanager_bin="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          avdmanager_bin="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          if [ ! -x "$sdkmanager_bin" ] || [ ! -x "$avdmanager_bin" ]; then
            python3 tools/provision_android_cli.py --output "$ANDROID_HOME/cmdline-tools/gym-m1"
            sdkmanager_bin="$ANDROID_HOME/cmdline-tools/gym-m1/bin/sdkmanager"
            avdmanager_bin="$ANDROID_HOME/cmdline-tools/gym-m1/bin/avdmanager"
          fi
          "$sdkmanager_bin" --sdk_root="$ANDROID_HOME" 'platform-tools' 'emulator' "system-images;android-${API};default;x86_64"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$avdmanager_bin" create avd --name recovery --package "system-images;android-${API};default;x86_64" --path "$ANDROID_AVD_HOME/recovery" --device pixel
          test -f "$ANDROID_AVD_HOME/recovery/config.ini"
          sed -i '/^disk.dataPartition.size[[:space:]]*=/d' "$ANDROID_AVD_HOME/recovery/config.ini"
          printf '\ndisk.dataPartition.size=6144M\n' >> "$ANDROID_AVD_HOME/recovery/config.ini"
          printf 'avd.ini.encoding=UTF-8\npath=%s/recovery\ntarget=android-%s\n' "$ANDROID_AVD_HOME" "$API" > "$ANDROID_AVD_HOME/recovery.ini"
          sudo chmod a+rw /dev/kvm
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
      - name: Boot emulator
        run: |
          "$ANDROID_HOME/emulator/emulator" -avd recovery -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot -partition-size 6144 -gpu swiftshader > /tmp/recovery-emulator.log 2>&1 &
          emulator_pid=$!
          adb start-server
          for attempt in $(seq 1 240); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              cat /tmp/recovery-emulator.log
              exit 1
            fi
            if [ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = '1' ]; then
              adb -s emulator-5554 shell settings put global window_animation_scale 0
              adb -s emulator-5554 shell settings put global transition_animation_scale 0
              adb -s emulator-5554 shell settings put global animator_duration_scale 0
              adb -s emulator-5554 shell settings put system screen_off_timeout 2147483647
              adb -s emulator-5554 shell settings put global stay_on_while_plugged_in 7
              adb -s emulator-5554 shell input keyevent KEYCODE_WAKEUP
              adb -s emulator-5554 shell wm dismiss-keyguard
              exit 0
            fi
            sleep 2
          done
          cat /tmp/recovery-emulator.log
          exit 1
      - name: SQLite transaction and recovery tests
        run: ./gradlew :android:connectedDebugAndroidTest
      - name: Real process termination and explicit resume
        run: |
          adb -s emulator-5554 install -r apps/android/build/outputs/apk/debug/android-debug.apk
          python3 tools/test_android_process_recovery.py --serial emulator-5554
      - name: Stop disposable emulator
        if: always()
        run: adb -s emulator-5554 emu kill || true
