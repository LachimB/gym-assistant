name: Validate starter contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install contract test tools
        run: python -m pip install -r tools/requirements.txt
      - name: Run fixture and traceability tests
        run: python -m unittest discover -s tests -v
      - name: Check package hygiene
        run: python tools/validate_starter.py && python tools/check_repo_hygiene.py
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Kotlin engine and in-memory store
        run: ./gradlew :engine:jvmTest :cloud-adapters:test
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: TypeScript engine tests
        working-directory: packages/engine-ts
        run: npm install && npm test
      - name: Web simulator tests
        working-directory: apps/web
        run: npm install && npm test
# Multi-version Android emulator CI is mandatory from M1, not in this M0 workflow.
