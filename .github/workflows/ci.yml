name: Validate starter contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install contract test tools
        run: python -m pip install -r tools/requirements.txt
      - name: Install checksum-pinned security test scanner
        run: bash tools/install_gitleaks.sh
      - name: Run fixture and traceability tests
        run: python -m unittest discover -s tests -v
      - name: Check package hygiene
        run: python tools/validate_starter.py && python tools/check_repo_hygiene.py
  engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Kotlin engine and in-memory store
        run: ./gradlew :engine:jvmTest :cloud-adapters:test
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: TypeScript engine tests
        working-directory: packages/engine-ts
        run: npm ci && npm test
      - name: Synthetic Drive experiment transport safeguards
        run: node --test tools/drive_scope_client.test.mjs tools/drive_conditional_probe.test.mjs tools/drive_folder_metadata_probe.test.mjs tools/drive_phone_readback.test.mjs tools/serve_web_history.test.mjs
      - name: Audit engine test dependencies
        working-directory: packages/engine-ts
        run: npm audit --include=dev --audit-level=moderate
      - name: Web simulator tests
        working-directory: apps/web
        run: npm ci && npm test
      - name: Web production build
        working-directory: apps/web
        run: npm run build
      - name: Audit web dependencies
        working-directory: apps/web
        run: npm audit --include=dev --audit-level=moderate
# Multi-version Android emulator CI is mandatory from M1, not in this M0 workflow.
