title = "Gym Assistant secret detection (trusted base configuration)"
[extend]
useDefault = true

[[rules]]
id = "credential-in-url"
description = "Authentication embedded in a URL"
regex = '''(?i)[a-z][a-z0-9+.-]*://[^\s/:@]+:[^\s/@]{3,}@'''

[[rules]]
id = "sensitive-assignment"
description = "Password, session, OAuth, webhook or signing secret assignment"
regex = '''(?i)(?:password|passwd|client_secret|refresh_token|session_cookie|webhook_secret|signing_key)\s*["']?\s*[:=]\s*["']?([A-Za-z0-9_+/=.!@#%-]{12,})'''
secretGroup = 1

[[rules]]
id = "private-key-header"
description = "Private key material, including incomplete keys"
regex = '''-----BEGIN (?:[A-Z0-9]+ )*PRIVATE KEY-----'''
